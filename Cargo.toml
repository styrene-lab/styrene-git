[workspace]
resolver = "2"
members = [
    "crates/styrene-git-core",
    "crates/styrene-git-functional",
    "crates/styrene-git-ipc",
    "crates/styrene-git-protocol",
    "crates/styrene-git-remote",
    "crates/styrene-git-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/styrene-lab/styrene-git"

[workspace.dependencies]
blake3 = "1.8"
data-encoding = "2.9"
ed25519-dalek = "=2.1.1"
hex = "0.4"
minicbor = { version = "2.3", features = ["derive", "std"] }
proptest = { version = "1.7", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
styrene-git-core = { path = "crates/styrene-git-core" }
styrene-git-ipc = { path = "crates/styrene-git-ipc" }
styrene-git-remote = { path = "crates/styrene-git-remote" }
styrene-git-protocol = { path = "crates/styrene-git-protocol" }
styrene-git-store = { path = "crates/styrene-git-store" }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
